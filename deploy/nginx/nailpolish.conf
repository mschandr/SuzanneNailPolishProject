# nginx site for Nail Polish Collector on a DigitalOcean droplet (Ubuntu + PHP-FPM).
# Replace example.com, the PHP-FPM socket path and the paths below. Put this in /etc/nginx/sites-available/ and enable it.
# Measured effect of the photo cache and the other settings: see load/README.md.

# Cache for PUBLIC photo responses only. PHP marks those "Cache-Control: public, max-age=60" and sends no cookies, so
# nginx keeps them and answers repeats without waking PHP (96-97% of photo requests in the load tests). Private photos
# are sent "private, no-store" and are never stored. Put this line in the http {} block (e.g. /etc/nginx/conf.d/photo-cache.conf):
#
#   fastcgi_cache_path /var/cache/nginx/photos levels=1:2 keys_zone=photos:20m max_size=500m inactive=10m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;
    root /var/www/nailpolish/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;   # certbot --nginx -d example.com
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Four photos of up to 10 MB each, plus form fields. PHP's limits must be at least this (deploy/php/nailpolish.ini).
    client_max_body_size 50m;

    include snippets/nailpolish-security-headers.conf;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    keepalive_timeout 65;
    keepalive_requests 1000;

    # Public photos: authorised by Laravel, cached here for 60 seconds. A Manicure made private or hidden can therefore
    # still be served for up to a minute from this cache; that window is the price of not waking PHP for every thumbnail.
    location ^~ /photos/ {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

        fastcgi_cache photos;
        fastcgi_cache_key "$scheme$host$request_uri";
        fastcgi_cache_valid 200 60s;
        fastcgi_cache_lock on;                  # many people asking for one cold photo cause one PHP request, not hundreds
        fastcgi_cache_use_stale updating;       # while one request refreshes an entry, others get the old copy
        add_header X-Cache-Status $upstream_cache_status always;
        include snippets/nailpolish-security-headers.conf;   # a location with its own add_header loses the server-level ones
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_keep_conn on;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Swatch photos and other files Laravel puts under public/storage.
    location /storage/ {
        expires 7d;
        add_header Cache-Control "public";
        include snippets/nailpolish-security-headers.conf;   # same reason
        try_files $uri =404;
    }
}
