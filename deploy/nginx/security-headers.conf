# Included by nailpolish.conf at the server level AND inside every location that sets its own add_header. nginx drops
# all inherited add_header lines in a location that declares even one of its own, so without the repeated include the
# photo and storage responses would silently lose these headers.
# Install next to the site file: /etc/nginx/snippets/nailpolish-security-headers.conf
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
