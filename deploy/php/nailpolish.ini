; /etc/php/8.3/fpm/conf.d/90-nailpolish.ini

; Without OPcache PHP recompiles every file on every request. validate_timestamps=0 means deploys must reload PHP-FPM
; (deploy/deploy.sh does: sudo systemctl reload php8.3-fpm).
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0

realpath_cache_size=4096k
realpath_cache_ttl=600

; Uploads: up to four 10 MB photos per Manicure.
upload_max_filesize=12M
post_max_size=50M
; Decoding a 40-megapixel photo needs about 160 MB, and the app raises this itself for the request.
memory_limit=256M

expose_php=0
display_errors=0
log_errors=1
