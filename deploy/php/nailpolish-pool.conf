; PHP-FPM pool for Nail Polish Collector (Ubuntu: /etc/php/8.3/fpm/pool.d/nailpolish.conf; disable the default www pool).
; How many workers? Each uses about 50 MB, and each keeps one Postgres connection open (DB_PERSISTENT=true).
; Rule of thumb: 4-6 workers per vCPU, at most (RAM available to PHP / 50 MB), and well under Postgres's max_connections.
;   2 GB droplet (1-2 vCPU): 10-12      4 GB (2 vCPU): 16-24      8 GB (4 vCPU): 24-40
; In the load tests (4 cores) 24 workers beat both 12 and 40.
[nailpolish]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data

pm = static
pm.max_children = 12
pm.max_requests = 2000               ; recycle workers now and then
request_terminate_timeout = 120s     ; generous: four 10 MB photos take a few seconds to process on a small droplet
catch_workers_output = yes
clear_env = no
