; /etc/supervisor/conf.d/nailpolish-worker.conf — runs the queue: sign-in emails and deleting files after an account is
; deleted. Without a running worker, sign-in links are never sent. After editing: supervisorctl reread && supervisorctl update
[program:nailpolish-worker]
command=php /var/www/nailpolish/artisan queue:work --sleep=2 --tries=3 --max-time=3600
directory=/var/www/nailpolish
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/nailpolish-worker.log
